<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konomi Konception v1 - Minimal Core</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #2a2a35;
      --text: #e0e0e0;
      --accent: #00d4ff;
      --success: #00ff88;
      --error: #ff4455;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: var(--accent); margin-bottom: 0.5rem; }
    .subtitle { color: #888; margin-bottom: 2rem; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .panel-title { font-size: 1.1rem; margin-bottom: 1rem; color: var(--accent); }
    .btn { padding: 0.5rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; margin-right: 0.5rem; margin-bottom: 0.5rem; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-secondary { background: var(--border); color: var(--text); }
    input, textarea { width: 100%; padding: 0.75rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: monospace; margin-bottom: 1rem; }
    .output { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; max-height: 300px; overflow: auto; }
    .test-result { padding: 0.5rem; margin: 0.25rem 0; border-radius: 4px; }
    .test-pass { background: rgba(0,255,136,0.1); color: var(--success); }
    .test-fail { background: rgba(255,68,85,0.1); color: var(--error); }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; text-align: center; }
    .stat-value { font-size: 1.5rem; color: var(--accent); font-weight: bold; }
    .stat-label { font-size: 0.75rem; color: #888; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="container">
    <h1>KONOMI KONCEPTION</h1>
    <p class="subtitle">v1 - Minimal Core | Utils + Crypto Only | ~15KB</p>

    <div class="stats">
      <div class="stat"><div class="stat-value" id="size">--</div><div class="stat-label">Size (KB)</div></div>
      <div class="stat"><div class="stat-value" id="boot">--</div><div class="stat-label">Boot (ms)</div></div>
      <div class="stat"><div class="stat-value" id="tests">--</div><div class="stat-label">Tests</div></div>
      <div class="stat"><div class="stat-value" id="status">--</div><div class="stat-label">Status</div></div>
    </div>

    <div class="panel">
      <div class="panel-title">SHA-256 Hash</div>
      <input type="text" id="hashInput" placeholder="Enter text to hash..." value="Hello, Konomi!">
      <button class="btn btn-primary" onclick="doHash()">Hash</button>
      <div class="output" id="hashOutput">Result will appear here...</div>
    </div>

    <div class="panel">
      <div class="panel-title">AES-256 Encryption</div>
      <input type="text" id="encryptInput" placeholder="Text to encrypt..." value="Secret message">
      <input type="text" id="encryptKey" placeholder="Password..." value="mypassword123">
      <button class="btn btn-primary" onclick="doEncrypt()">Encrypt</button>
      <button class="btn btn-secondary" onclick="doDecrypt()">Decrypt</button>
      <div class="output" id="encryptOutput">Result will appear here...</div>
    </div>

    <div class="panel">
      <div class="panel-title">Self-Test Results</div>
      <button class="btn btn-primary" onclick="runTests()">Run Tests</button>
      <div id="testResults" class="output" style="margin-top: 1rem;"></div>
    </div>
  </div>

<script>
// ============================================
// KONOMI KONCEPTION v1 - MINIMAL CORE
// Utils + Crypto Only
// ============================================

const Konomi = {
  version: '1.0.0-minimal',
  bootTime: 0
};

// ============================================
// CORE UTILITIES
// ============================================

const Utils = {
  _state: [Date.now() >>> 0, 0, 0, 0],

  initRandom() {
    const seed = Date.now() ^ (Math.random() * 0xFFFFFFFF) ^ (performance.now() * 1000);
    this._state[0] = seed >>> 0;
    this._state[1] = (seed * 1103515245 + 12345) >>> 0;
    this._state[2] = (this._state[1] * 1103515245 + 12345) >>> 0;
    this._state[3] = (this._state[2] * 1103515245 + 12345) >>> 0;
  },

  random() {
    let s1 = this._state[0], s0 = this._state[1];
    const result = (s0 + s1) >>> 0;
    this._state[0] = s0;
    s1 ^= s1 << 23;
    this._state[1] = s1 ^ s0 ^ (s1 >>> 17) ^ (s0 >>> 26);
    return result / 0xFFFFFFFF;
  },

  randomBytes(len) {
    const bytes = new Uint8Array(len);
    if (crypto?.getRandomValues) crypto.getRandomValues(bytes);
    else for (let i = 0; i < len; i++) bytes[i] = Math.floor(this.random() * 256);
    return bytes;
  },

  utf8Encode(str) {
    const bytes = [];
    for (let i = 0; i < str.length; i++) {
      let c = str.charCodeAt(i);
      if (c < 0x80) bytes.push(c);
      else if (c < 0x800) bytes.push(0xC0 | (c >> 6), 0x80 | (c & 0x3F));
      else bytes.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 0x3F), 0x80 | (c & 0x3F));
    }
    return new Uint8Array(bytes);
  },

  utf8Decode(bytes) {
    let str = '', i = 0;
    while (i < bytes.length) {
      let b = bytes[i++];
      if (b < 0x80) str += String.fromCharCode(b);
      else if (b < 0xE0) str += String.fromCharCode(((b & 0x1F) << 6) | (bytes[i++] & 0x3F));
      else str += String.fromCharCode(((b & 0x0F) << 12) | ((bytes[i++] & 0x3F) << 6) | (bytes[i++] & 0x3F));
    }
    return str;
  },

  base64Chars: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/',

  base64Encode(bytes) {
    let r = '', len = bytes.length;
    for (let i = 0; i < len; i += 3) {
      const b1 = bytes[i], b2 = i + 1 < len ? bytes[i + 1] : 0, b3 = i + 2 < len ? bytes[i + 2] : 0;
      r += this.base64Chars[b1 >> 2] + this.base64Chars[((b1 & 0x03) << 4) | (b2 >> 4)];
      r += i + 1 < len ? this.base64Chars[((b2 & 0x0F) << 2) | (b3 >> 6)] : '=';
      r += i + 2 < len ? this.base64Chars[b3 & 0x3F] : '=';
    }
    return r;
  },

  base64Decode(str) {
    const bytes = [];
    str = str.replace(/=/g, '');
    for (let i = 0; i < str.length; i += 4) {
      const b1 = this.base64Chars.indexOf(str[i]), b2 = this.base64Chars.indexOf(str[i + 1]);
      const b3 = i + 2 < str.length ? this.base64Chars.indexOf(str[i + 2]) : 0;
      const b4 = i + 3 < str.length ? this.base64Chars.indexOf(str[i + 3]) : 0;
      bytes.push((b1 << 2) | (b2 >> 4));
      if (i + 2 < str.length) bytes.push(((b2 & 0x0F) << 4) | (b3 >> 2));
      if (i + 3 < str.length) bytes.push(((b3 & 0x03) << 6) | b4);
    }
    return new Uint8Array(bytes);
  },

  hexEncode(bytes) {
    return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
  },

  uuid() {
    const bytes = this.randomBytes(16);
    bytes[6] = (bytes[6] & 0x0F) | 0x40;
    bytes[8] = (bytes[8] & 0x3F) | 0x80;
    const hex = this.hexEncode(bytes);
    return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20, 32)}`;
  }
};

// ============================================
// SHA-256
// ============================================

const SHA256 = {
  K: [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
      0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
      0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
      0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
      0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
      0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
      0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
      0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2],

  H0: [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19],

  rotr: (n, x) => ((x >>> n) | (x << (32 - n))) >>> 0,

  hashBytes(bytes) {
    const len = bytes.length, bitLen = len * 8;
    let padLen = 64 - ((len + 9) % 64); if (padLen === 64) padLen = 0;
    const padded = new Uint8Array(len + 1 + padLen + 8);
    padded.set(bytes); padded[len] = 0x80;
    new DataView(padded.buffer).setUint32(padded.length - 4, bitLen >>> 0, false);

    let H = [...this.H0];
    for (let i = 0; i < padded.length; i += 64) {
      const W = new Uint32Array(64), view = new DataView(padded.buffer, i);
      for (let j = 0; j < 16; j++) W[j] = view.getUint32(j * 4, false);
      for (let j = 16; j < 64; j++) {
        const s0 = this.rotr(7, W[j-15]) ^ this.rotr(18, W[j-15]) ^ (W[j-15] >>> 3);
        const s1 = this.rotr(17, W[j-2]) ^ this.rotr(19, W[j-2]) ^ (W[j-2] >>> 10);
        W[j] = (W[j-16] + s0 + W[j-7] + s1) >>> 0;
      }
      let [a,b,c,d,e,f,g,h] = H;
      for (let j = 0; j < 64; j++) {
        const S1 = this.rotr(6,e) ^ this.rotr(11,e) ^ this.rotr(25,e);
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + this.K[j] + W[j]) >>> 0;
        const S0 = this.rotr(2,a) ^ this.rotr(13,a) ^ this.rotr(22,a);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      H = [(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
    }
    const result = new Uint8Array(32), rv = new DataView(result.buffer);
    for (let i = 0; i < 8; i++) rv.setUint32(i * 4, H[i], false);
    return result;
  },

  hash(str) {
    return Utils.hexEncode(this.hashBytes(Utils.utf8Encode(str)));
  }
};

// AES-256
// ============================================

  gmul(a, b) {
    let p = 0;
    for (let i = 0; i < 8; i++) {
      if (b & 1) p ^= a;
      const hi = a & 0x80;
      a = (a << 1) & 0xFF;
      if (hi) a ^= 0x1b;
      b >>= 1;

  keyExpansion(key) {

    const invSubBytes = () => { for (let i=0;i<16;i++) s[i]=this.INV_SBOX[s[i]]; };
    const invShiftRows = () => { let t=s[13];s[13]=s[9];s[9]=s[5];s[5]=s[1];s[1]=t; t=s[2];s[2]=s[10];s[10]=t;t=s[6];s[6]=s[14];s[14]=t; t=s[3];s[3]=s[7];s[7]=s[11];s[11]=s[15];s[15]=t; };
    const invMixCols = () => { for (let c=0;c<4;c++) { const i=c*4,a=[...s.slice(i,i+4)]; s[i]=this.gmul(0x0e,a[0])^this.gmul(0x0b,a[1])^this.gmul(0x0d,a[2])^this.gmul(0x09,a[3]); s[i+1]=this.gmul(0x09,a[0])^this.gmul(0x0e,a[1])^this.gmul(0x0b,a[2])^this.gmul(0x0d,a[3]); s[i+2]=this.gmul(0x0d,a[0])^this.gmul(0x09,a[1])^this.gmul(0x0e,a[2])^this.gmul(0x0b,a[3]); s[i+3]=this.gmul(0x0b,a[0])^this.gmul(0x0d,a[1])^this.gmul(0x09,a[2])^this.gmul(0x0e,a[3]); }};
    addKey(14);
    for (let r=13;r>0;r--) { invShiftRows(); invSubBytes(); addKey(r); invMixCols(); }
    invShiftRows(); invSubBytes(); addKey(0);
    return s;
  },

  encrypt(plaintext, password) {
    const key = SHA256.hashBytes(Utils.utf8Encode(password));
    const iv = Utils.randomBytes(16);
    const data = Utils.utf8Encode(plaintext);
    const padLen = 16 - (data.length % 16);
    const padded = new Uint8Array(data.length + padLen);
    padded.set(data);
    for (let i = data.length; i < padded.length; i++) padded[i] = padLen;
    const W = this.keyExpansion(key);
    const ct = new Uint8Array(padded.length);
    let prev = iv;
    for (let i = 0; i < padded.length; i += 16) {
      const block = new Uint8Array(16);
      for (let j = 0; j < 16; j++) block[j] = padded[i + j] ^ prev[j];
      const enc = this.encryptBlock(block, W);
      ct.set(enc, i);
      prev = enc;
    }
    const result = new Uint8Array(16 + ct.length);
    result.set(iv);
    result.set(ct, 16);
    return Utils.base64Encode(result);
  },

  decrypt(ciphertext, password) {
    const key = SHA256.hashBytes(Utils.utf8Encode(password));
    const data = Utils.base64Decode(ciphertext);
    const iv = data.slice(0, 16), ct = data.slice(16);
    const W = this.keyExpansion(key);
    const pt = new Uint8Array(ct.length);
    let prev = iv;
    for (let i = 0; i < ct.length; i += 16) {
      const block = ct.slice(i, i + 16);
      const dec = this.decryptBlock(block, W);
      for (let j = 0; j < 16; j++) pt[i + j] = dec[j] ^ prev[j];
      prev = block;
    }
    const padLen = pt[pt.length - 1];
    return Utils.utf8Decode(pt.slice(0, pt.length - padLen));
  }
};

// ============================================
// SELF-TEST
// ============================================

const Tests = {
  results: [],

  run() {
    this.results = [];

    // SHA256 tests
    this.test('SHA256: empty string', () =>
      SHA256.hash('') === 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855');

    this.test('SHA256: "abc"', () =>
      SHA256.hash('abc') === 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad');

    this.test('SHA256: "hello"', () =>
      SHA256.hash('hello') === '2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824');

    // AES tests
    this.test('AES: encrypt/decrypt roundtrip', () => {
      const msg = 'Hello, Konomi Konception!';
      const pwd = 'testpassword123';
      const enc = AES.encrypt(msg, pwd);
      const dec = AES.decrypt(enc, pwd);
      return dec === msg;
    });

    this.test('AES: different passwords fail', () => {
      const enc = AES.encrypt('secret', 'pass1');
      try { AES.decrypt(enc, 'pass2'); return false; }
      catch { return true; }
    });

    // Utils tests
    this.test('Utils: UUID format', () =>
      /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(Utils.uuid()));

    this.test('Utils: Base64 roundtrip', () => {
      const orig = 'Hello, World! 123';
      const enc = Utils.base64Encode(Utils.utf8Encode(orig));
      const dec = Utils.utf8Decode(Utils.base64Decode(enc));
      return dec === orig;
    });

    this.test('Utils: UTF8 roundtrip', () => {
      const orig = 'Hello 世界 🌍';
      const enc = Utils.utf8Encode(orig);
      const dec = Utils.utf8Decode(enc);
      return dec === orig;
    });

    return this.results;
  },

  test(name, fn) {
    try {
      const pass = fn();
      this.results.push({ name, pass, error: null });
    } catch (e) {
      this.results.push({ name, pass: false, error: e.message });
    }
  }
};

// ============================================
// UI FUNCTIONS
// ============================================

let encryptedData = '';

function doHash() {
  const input = document.getElementById('hashInput').value;
  const hash = SHA256.hash(input);
  document.getElementById('hashOutput').textContent = `Input: "${input}"\nSHA-256: ${hash}`;
}

function doEncrypt() {
  const input = document.getElementById('encryptInput').value;
  const key = document.getElementById('encryptKey').value;
  encryptedData = AES.encrypt(input, key);
  document.getElementById('encryptOutput').textContent = `Encrypted:\n${encryptedData}`;
}

function doDecrypt() {
  const key = document.getElementById('encryptKey').value;
  try {
    const decrypted = AES.decrypt(encryptedData || document.getElementById('encryptInput').value, key);
    document.getElementById('encryptOutput').textContent = `Decrypted: "${decrypted}"`;
  } catch (e) {
    document.getElementById('encryptOutput').textContent = `Decryption failed: ${e.message}`;
  }
}

function runTests() {
  const results = Tests.run();
  const el = document.getElementById('testResults');
  el.innerHTML = results.map(r =>
    `<div class="test-result ${r.pass ? 'test-pass' : 'test-fail'}">${r.pass ? '✓' : '✗'} ${r.name}${r.error ? ': ' + r.error : ''}</div>`
  ).join('');

  const passed = results.filter(r => r.pass).length;
  document.getElementById('tests').textContent = `${passed}/${results.length}`;
  document.getElementById('status').textContent = passed === results.length ? 'PASS' : 'FAIL';
  document.getElementById('status').style.color = passed === results.length ? 'var(--success)' : 'var(--error)';
}

// ============================================
// BOOTSTRAP
// ============================================

window.addEventListener('DOMContentLoaded', () => {
  const start = performance.now();
  Utils.initRandom();
  Konomi.bootTime = performance.now() - start;

  document.getElementById('boot').textContent = Konomi.bootTime.toFixed(0);
  document.getElementById('size').textContent = (document.documentElement.outerHTML.length / 1024).toFixed(1);

  runTests();
});
</script>
